const D=[
{id:'smell',name:['O olfacto','El olfato','Smell'],children:[
{id:'smell-function',name:['Que capta','Qué capta','What it detects'],levels:[['olor · substancias · miles de olores','olor · sustancias · miles de olores','odour · substances · thousands of smells'],['O olfacto permite captar o olor das substancias.','El olfato permite captar el olor de las sustancias.','Smell lets us detect the odour of substances.'],['Podemos recoñecer miles de olores diferentes grazas ao sentido do olfacto.','Podemos reconocer miles de olores diferentes gracias al olfato.','We can recognise thousands of different smells through our sense of smell.'],['Ao identificar un olor, estás usando o olfacto; o gusto, en cambio, informa sobre sabores.','Al identificar un olor, usas el olfato; el gusto informa sobre sabores.','When you identify an odour, you use smell; taste tells you about flavours.']]},
{id:'smell-organ',name:['Nariz e receptores','Nariz y receptores','Nose and receptors'],levels:[['nariz · interior · receptores','nariz · interior · receptores','nose · inside · receptors'],['O nariz é o órgano; no seu interior están os receptores do olfacto.','La nariz es el órgano; en su interior están los receptores del olfato.','The nose is the organ; smell receptors are inside it.'],['Os receptores do olfacto que hai no interior do nariz captan os olores.','Los receptores del olfato del interior de la nariz captan los olores.','The smell receptors inside the nose detect odours.'],['Se o olor é moi intenso, cómpre afastarse ou ventilar: coidamos así o órgano e o sentido.','Si el olor es muy intenso, conviene alejarse o ventilar: así cuidamos el órgano y el sentido.','If a smell is very strong, move away or ventilate: this protects the organ and sense.']]},
{id:'smell-care',name:['Coidado do olfacto','Cuidado del olfato','Caring for smell'],levels:[['non introducir obxectos · evitar olores intensos','no introducir objetos · evitar olores intensos','no objects in nose · avoid strong smells'],['Non introduzas obxectos no nariz e evita olores moi intensos e molestos, como o da pintura.','No introduzcas objetos en la nariz y evita olores muy intensos y molestos, como el de la pintura.','Do not put objects in your nose and avoid very strong, unpleasant smells, such as paint.'],['Estes dous consellos do libro axudan a protexer o nariz e o sentido do olfacto.','Estos dos consejos del libro ayudan a proteger la nariz y el olfato.','These two textbook tips help protect the nose and sense of smell.'],['Se estás preto dun olor a pintura moi intenso, afástate: é unha aplicación do consello de evitar olores molestos.','Si estás cerca de un olor a pintura muy intenso, aléjate: aplicas el consejo de evitar olores molestos.','If you are near a very strong paint smell, move away: you are applying the advice to avoid unpleasant smells.']]}]},
{id:'taste',name:['O gusto','El gusto','Taste'],children:[
{id:'taste-function',name:['Sabores básicos','Sabores básicos','Basic tastes'],levels:[['sabor · doce · salgado · ácido · amargo · umami','sabor · dulce · salado · ácido · amargo · umami','taste · sweet · salty · sour · bitter · umami'],['O gusto detecta o sabor dos alimentos; distinguimos cinco sabores básicos.','El gusto detecta el sabor de los alimentos; distinguimos cinco sabores básicos.','Taste detects food flavours; we distinguish five basic tastes.'],['Os cinco sabores básicos do libro son doce, salgado, ácido, amargo e umami.','Los cinco sabores básicos del libro son dulce, salado, ácido, amargo y umami.','The textbook lists five basic tastes: sweet, salty, sour, bitter and umami.'],['Cando describes un alimento como doce ou salgado, estás falando do gusto, non do tacto.','Cuando describes un alimento como dulce o salado, hablas del gusto, no del tacto.','When you describe food as sweet or salty, you are referring to taste, not touch.']]},
{id:'taste-organ',name:['Lingua e papilas','Lengua y papilas','Tongue and taste buds'],levels:[['lingua · papilas gustativas · sabores','lengua · papilas gustativas · sabores','tongue · taste buds · flavours'],['A lingua é o órgano do gusto; nela hai papilas gustativas que captan sabores.','La lengua es el órgano del gusto; en ella hay papilas gustativas que captan sabores.','The tongue is the taste organ; its taste buds detect flavours.'],['As papilas gustativas son pequenos avultamentos da lingua cos que captamos os sabores.','Las papilas gustativas son pequeños bultos de la lengua con los que captamos los sabores.','Taste buds are small bumps on the tongue that help us detect flavours.'],['Non confundas órgano con receptores: a lingua é o órgano e as papilas gustativas captan os sabores.','No confundas órgano con receptores: la lengua es el órgano y las papilas gustativas captan los sabores.','Do not confuse organ and receptors: the tongue is the organ; taste buds detect flavours.']]},
{id:'taste-care',name:['Coidado da lingua','Cuidado de la lengua','Caring for the tongue'],levels:[['temperatura · nin moi fría nin moi quente · cepillado suave','temperatura · ni muy fría ni muy caliente · cepillado suave','temperature · not too cold or hot · gentle brushing'],['Vixía a temperatura da comida e cepilla suavemente a lingua despois dos dentes.','Vigila la temperatura de la comida y cepilla suavemente la lengua después de los dientes.','Check food temperature and gently brush the tongue after brushing teeth.'],['O libro recomenda que a comida non estea moi fría nin moi quente e cepillar suavemente a superficie da lingua tras cepillar os dentes.','El libro recomienda que la comida no esté muy fría ni muy caliente y cepillar suavemente la lengua tras cepillarse los dientes.','The book advises avoiding very hot or cold food and gently brushing the tongue after brushing your teeth.'],['Antes de probar comida moi quente, agarda a que arrefríe: así coidas a lingua.','Antes de probar comida muy caliente, espera a que se enfríe: así cuidas la lengua.','Before tasting very hot food, let it cool: this protects your tongue.']]}]},
{id:'touch',name:['O tacto','El tacto','Touch'],children:[
{id:'touch-function',name:['Que coñecemos','Qué conocemos','What we learn'],levels:[['obxectos · características · contacto · reacción','objetos · características · contacto · reacción','objects · characteristics · contact · reaction'],['O tacto permite coñecer características do que tocamos e reaccionar cando algo nos toca.','El tacto permite conocer características de lo que tocamos y reaccionar cuando algo nos toca.','Touch helps us learn characteristics of what we touch and react when something touches us.'],['Co tacto percibimos características dos obxectos ao tocalos e reaccionamos adecuadamente ao contacto.','Con el tacto percibimos características de los objetos al tocarlos y reaccionamos adecuadamente al contacto.','Touch tells us some characteristics of an object through contact and helps us respond to being touched.'],['Un xeo pode sentirse frío e un peluche suave; son exemplos de características percibidas co tacto.','Un hielo puede sentirse frío y un peluche suave; son características percibidas con el tacto.','Ice can feel cold and a teddy bear soft: these are characteristics perceived by touch.']]},
{id:'touch-organ',name:['Pel e receptores','Piel y receptores','Skin and receptors'],levels:[['pel · receptores · labios · xemas dos dedos','piel · receptores · labios · yemas de los dedos','skin · receptors · lips · fingertips'],['A pel é o órgano do tacto e nela están os seus receptores.','La piel es el órgano del tacto y en ella están sus receptores.','The skin is the touch organ and contains its receptors.'],['Algunhas partes da pel son máis sensibles ca outras; o libro pon como exemplos os labios e as xemas dos dedos.','Algunas partes de la piel son más sensibles que otras; el libro cita los labios y las yemas de los dedos.','Some areas of skin are more sensitive than others; the book mentions lips and fingertips.'],['As xemas dos dedos son máis sensibles ca outras zonas: por iso serven para notar detalles ao tocar un obxecto.','Las yemas de los dedos son más sensibles que otras zonas: por eso sirven para notar detalles al tocar un objeto.','Fingertips are more sensitive than other areas, so they help you notice details by touch.']]},
{id:'touch-care',name:['Coidado da pel','Cuidado de la piel','Caring for the skin'],levels:[['hixiene diaria · sol con moderación · crema protectora','higiene diaria · sol con moderación · crema protectora','daily hygiene · moderate sun · sun protection'],['Mantén a pel limpa; toma o sol con moderación e usa crema protectora.','Mantén la piel limpia; toma el sol con moderación y usa crema protectora.','Keep skin clean; take the sun in moderation and use protective cream.'],['A hixiene diaria e a protección fronte aos raios solares coidan a pel e, polo tanto, o sentido do tacto.','La higiene diaria y la protección frente a los rayos solares cuidan la piel y, por tanto, el tacto.','Daily hygiene and protection from sunlight care for the skin and therefore the sense of touch.'],['Aínda que a crema sexa pegañenta, na praia axuda a protexer a pel dos raios solares.','Aunque la crema sea pegajosa, en la playa ayuda a proteger la piel de los rayos solares.','Even if sunscreen feels sticky, it helps protect skin from sunlight at the beach.']]}]}];

function mapPrint(){return `<h1>${esc(T().title)}</h1>${D.map(g=>`<h2>${esc(tr(g.name))}</h2><ul>${g.children.map(c=>`<li>${esc(tr(c.name))}</li>`).join('')}</ul>`).join('')}`}
function printSection(which){let html='';if(which==='map')html=mapPrint();if(which==='notes')html=mapPrint()+D.map(g=>`<h2>${esc(tr(g.name))}</h2>${g.children.map(c=>`<div class="tile"><h3>${esc(tr(c.name))}</h3><p>${esc(tr(c.levels[state.level]))}</p></div>`).join('')}`).join('');if(which==='table'){const heads=[T().sense,T().function,T().organ,T().receptors,T().care];html=`<h1>${T().tabs[2]}</h1><table><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${matrix().map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}if(which==='exam')html=`<h1>${T().tabs[4]}</h1>${Q.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(tr(q.text))}</b><p>${q.type==='open'?'........................................................................................':tr(q.options).map(x=>`○ ${esc(x)}`).join('　')}</p></div>`).join('')}<div class="answer-page"><h1>${T().answer}</h1>${Q.map((q,i)=>`<p><b>${i+1}.</b> ${esc(q.type==='open'?tr(q.answer):tr(q.options)[q.right])}</p>`).join('')}</div>`;if(which==='cards')html=`<h1>${T().tabs[5]}</h1>${C.map((c,i)=>`<div class="flash-print"><b>${i+1}. ${esc(tr(c[1]))}</b><p>${esc(tr(c[2]))}</p></div>`).join('')}`;document.getElementById('print-root').innerHTML=html;window.print()}
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportAnki(){const clean=s=>String(s).replace(/[\t\r\n]+/g,' ');download('olfacto-gusto-tacto-anki.tsv',C.map(c=>clean(tr(c[1]))+'\t'+clean(tr(c[2]))).join('\n'),'text/tab-separated-values;charset=utf-8')}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===s}
function importBackup(input){if(!input||input.id!==ID||![1,2].includes(input.version)||!['gl','es','en'].includes(input.lang))throw Error('invalid');const next={...defaultState(),...input,cards:{...defaultState().cards,...input.cards}};if(!Array.isArray(next.cards.queue)||!next.cards.stats||typeof next.cards.stats!=='object')throw Error('invalid');for(const [id,st] of Object.entries(next.cards.stats)){if(!C.some(c=>c[0]===id)||!validDate(st.due)||!Number.isFinite(st.lastReviewed))throw Error('invalid');const local=state.cards.stats[id];if(local&&local.lastReviewed>st.lastReviewed)next.cards.stats[id]=local}next.cards.queue=next.cards.queue.filter(id=>C.some(c=>c[0]===id));next.cards.index=Math.max(0,Math.min(Number(next.cards.index)||0,next.cards.queue.length));state=next;render()}
document.getElementById('lang').onchange=e=>{state.lang=e.target.value;render()};document.getElementById('download').onclick=()=>download('olfacto-gusto-tacto.html','<!doctype html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8');document.getElementById('export').onclick=()=>download('olfacto-gusto-tacto-progreso.json',JSON.stringify(state,null,2),'application/json');document.getElementById('import').onchange=async e=>{try{importBackup(JSON.parse(await e.target.files[0].text()));alert(T().imported)}catch{alert(T().invalid)}e.target.value=''};render();
</script></body></html>
